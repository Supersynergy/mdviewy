name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Match the release tag to desktop manifests
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, tomllib
          desktop = pathlib.Path("apps/desktop")
          native = desktop / "src-tauri"
          versions = {
              json.loads((desktop / "package.json").read_text())["version"],
              json.loads((native / "tauri.conf.json").read_text())["version"],
              tomllib.loads((native / "Cargo.toml").read_text())["package"]["version"],
          }
          if versions != {os.environ["GITHUB_REF_NAME"].removeprefix("v")}:
              raise SystemExit(f"Tag {os.environ['GITHUB_REF_NAME']} conflicts with desktop versions {versions}")
          PYTHON

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - build: macos
            os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
          - build: macos
            os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
          - build: windows
            os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node setup
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev patchelf libgtk-3-dev librsvg2-dev libxcb-shape0-dev libxcb-xfixes0-dev libsoup-3.0 javascriptcoregtk-4.1 webkit2gtk-4.1 pkg-config libfreetype6-dev libfontconfig1-dev

      - name: Write env file
        run: |
          echo VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}  >> ./apps/desktop/.env

      - name: Rust setup
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup
        run: yarn setup

      - name: Build workspaces
        run: yarn build

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the app
        env:
          RUSTC_WRAPPER: ""
        run: yarn build:desktop --target ${{ matrix.target }}

      - name: Seal and verify macOS prerelease bundle
        if: matrix.os == 'macos-latest'
        run: scripts/prepare-macos-prerelease.sh ./target/${{ matrix.target }}/release/bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/appimage/**.AppImage.*
            ./target/${{ matrix.target }}/release/bundle/appimage/**.AppImage
            ./target/${{ matrix.target }}/release/bundle/deb/**.deb
            ./target/${{ matrix.target }}/release/bundle/rpm/**.rpm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'macos-latest' && matrix.arch == 'aarch64'
        with:
          name: aarch64artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/dmg/**.dmg
            ./target/${{ matrix.target }}/release/bundle/macos/**.app.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'macos-latest' && matrix.arch == 'x86_64'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/dmg/**.dmg
            ./target/${{ matrix.target }}/release/bundle/macos/**.app.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'windows-latest'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/msi/**
            ./target/${{ matrix.target }}/release/bundle/nsis/**

  build-offline-installer:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: windows-offline-installer
            os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write env file
        run: |
          echo VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}  >> ./apps/desktop/.env

      - name: Node setup
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Rust setup
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup
        run: yarn setup

      - name: Use offline bundle
        if: matrix.os == 'windows-latest'
        run: yarn use-offline-bundle

      - name: Build workspaces
        run: yarn build

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the app
        env:
          RUSTC_WRAPPER: ""
        run: yarn build:desktop --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'windows-latest'
        with:
          name: offline-installer-artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/msi/**
            ./target/${{ matrix.target }}/release/bundle/nsis/**

  release:
    permissions:
      contents: write
    needs: [build, build-offline-installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Query version number
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download x86_64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts/x86_64
          merge-multiple: true

      - name: Download aarch64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aarch64artifacts-*
          path: artifacts/aarch64
          merge-multiple: true

      - name: Download offline installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: offline-installer-artifacts-*
          path: artifacts/offline-installer
          merge-multiple: true

      - name: Prepare release assets
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mkdir -p release-assets

          copy_asset() {
            local source="$1"
            local target="$2"
            cp "$source" "release-assets/$target"
          }

          for file in artifacts/x86_64/**/* artifacts/aarch64/**/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.dmg|*.deb|*.rpm|*.AppImage|*.msi|*.exe|*.tar.gz|*.sig)
                copy_asset "$file" "$(basename "$file")"
                ;;
            esac
          done

          for file in artifacts/offline-installer/**/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.msi|*.exe|*.sig)
                name="$(basename "$file")"
                copy_asset "$file" "${name/mdviewy_/mdviewy_offline_}"
                ;;
            esac
          done

          cd release-assets
          for pattern in "mdviewy_${version}_aarch64.dmg" "mdviewy_${version}_x64.dmg" "mdviewy_${version}_x64-setup.exe" "mdviewy_offline_${version}_x64-setup.exe" "mdviewy_${version}_x64_*.msi" "mdviewy_offline_${version}_x64_*.msi" "mdviewy_${version}_amd64.deb" "mdviewy-${version}-*.x86_64.rpm" "mdviewy_${version}_amd64.AppImage"; do
            compgen -G "$pattern" > /dev/null || { echo "Missing release asset: $pattern"; exit 1; }
          done
          sha256sum * > SHA256SUMS.txt

      - run: |
          cat > release.txt << 'EOF'
          ## Warm handoffs

          Open `_handoff-project.md` and type your answer after `>>>Userantwort:`. Open fields appear in gold and answered fields in green. Alt+Shift+N jumps to the next open field. Code examples are skipped.

          ## RTF preview

          The reader preserves paragraphs in macOS documents, Windows punctuation and Unicode fallback characters. RTF handoff previews highlight exported answer labels.

          ## Downloads

          Choose the Apple Silicon or Intel DMG, the x64 Windows installer, or a Linux AppImage, DEB or RPM. Windows offline installers include WebView2. SHA256SUMS.txt lists the download checksums.

          macOS bundles have an ad-hoc signature and are not notarized. Windows installers are unsigned.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          body_path: release.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./release-assets/*
          fail_on_unmatched_files: true
