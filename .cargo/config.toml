# Project-local cargo config — Mac arm64 startup tunings.
# Apple ld (Xcode 16) is the only Mach-O linker; mold/lld don't apply.

[build]
# Keep build locks local so other workspaces can build independently.
target-dir = "target"

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-Wl,-dead_strip",
  "-C", "target-cpu=apple-m1",
]
